<!doctype html>
<html lang="en">
<head>
  {% include site_head.html %}
</head>
<body>
  <div class="wrap">
  {% include site_header.html %}

  <div class="content-wrap">
    <article class="post">
      <header class="post-head">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="meta">{{ page.date | date: "%b %d, %Y" }}</div>
      </header>

      <div class="content">
        {{ content }}
      </div>
    </article>
  </div>

  {% include site_footer.html %}
</div>
</body>
</html>
